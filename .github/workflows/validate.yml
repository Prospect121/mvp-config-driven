name: Validate Configurations and Examples

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'configs/**/*.yml'
      - 'configs/**/*.yaml'
      - 'examples/**/*.yml'
      - 'examples/**/*.yaml'
      - 'datacore/config/schemas/**/*.json'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'configs/**/*.yml'
      - 'configs/**/*.yaml'
      - 'examples/**/*.yml'
      - 'examples/**/*.yaml'
      - 'datacore/config/schemas/**/*.json'
  workflow_dispatch:

jobs:
  validate-configs:
    name: Validate Configuration Files
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Validate all configuration files
        run: |
          echo "=== Validating Configuration Files ==="
          FAILED=0
          PASSED=0
          
          mapfile -t files < <(find configs/envs -type f \( -name "*.yml" -o -name "*.yaml" \))
          if [ ${#files[@]} -eq 0 ]; then
            echo "No configuration files found under configs/envs/"
          fi
          
          for file in "${files[@]}"; do
            echo "Validating: $file"
            if prodi validate --config "$file"; then
              echo "✅ PASSED: $file"
              ((PASSED++))
            else
              echo "❌ FAILED: $file"
              ((FAILED++))
            fi
          done
          
          echo ""
          echo "=== Validation Summary ==="
          echo "Passed: $PASSED"
          echo "Failed: $FAILED"
          
          if [ $FAILED -gt 0 ]; then
            echo "❌ Validation failed for $FAILED file(s)"
            exit 1
          fi
          
          echo "✅ All configuration files are valid!"

  validate-examples:
    name: Validate Example Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Validate all example files
        run: |
          echo "=== Validating Example Files ==="
          FAILED=0
          PASSED=0
          
          mapfile -t files < <(find examples -type f \( -name "*.yaml" -o -name "*.yml" \))
          if [ ${#files[@]} -eq 0 ]; then
            echo "No example files found under examples/"
          fi
          
          for file in "${files[@]}"; do
            echo "Validating: $file"
            if prodi validate --config "$file"; then
              echo "✅ PASSED: $file"
              ((PASSED++))
            else
              echo "❌ FAILED: $file"
              ((FAILED++))
            fi
          done
          
          echo ""
          echo "=== Validation Summary ==="
          echo "Passed: $PASSED"
          echo "Failed: $FAILED"
          
          if [ $FAILED -gt 0 ]; then
            echo "❌ Validation failed for $FAILED example(s)"
            exit 1
          fi
          
          echo "✅ All examples are valid!"

  validate-schemas:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install JSON Schema validator
        run: pip install jsonschema
      
      - name: Validate schema files
        run: |
          echo "=== Validating JSON Schema Files ==="
          python -c "
          import json
          import sys
          from pathlib import Path
          
          failed = 0
          passed = 0
          
          for schema_file in Path('datacore/config/schemas').glob('*.json'):
              print(f'Validating: {schema_file}')
              try:
                  with open(schema_file) as f:
                      json.load(f)
                  print(f'✅ PASSED: {schema_file}')
                  passed += 1
              except json.JSONDecodeError as e:
                  print(f'❌ FAILED: {schema_file} - {e}')
                  failed += 1
          
          print()
          print('=== Validation Summary ===')
          print(f'Passed: {passed}')
          print(f'Failed: {failed}')
          
          if failed > 0:
              print(f'❌ Validation failed for {failed} schema(s)')
              sys.exit(1)
          
          print('✅ All schemas are valid!')
          "

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-configs, validate-examples, validate-schemas]
    if: always()
    
    steps:
      - name: Check validation results
        run: |
          if [ "${{ needs.validate-examples.result }}" != "success" ] ||
             [ "${{ needs.validate-schemas.result }}" != "success" ]; then
            echo "❌ Some validations failed"
            exit 1
          fi
          echo "✅ All validations passed successfully!"
