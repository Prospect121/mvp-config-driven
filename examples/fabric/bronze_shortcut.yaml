project: fabric-demo
environment: dev
platform: fabric
providers:
  fabric:
    workspace_id: "${FABRIC_WORKSPACE_ID}"
    environment_id: "${FABRIC_ENVIRONMENT_ID}"
    lakehouse_id: "${FABRIC_LAKEHOUSE_ID}"

datasets:
  - name: sales_shortcut
    layer: bronze
    source:
      type: shortcut
      name: sales_onelake
      read_options:
        format: delta
    sink:
      type: storage
      backend: fabric
      format: delta
      uri: "lakehouse://contoso-lh/tables/dbo/sales_bronze"
      mode: append
    incremental:
      mode: append
    orchestration:
      fabric:
        create_items: [lakehouse, spark_job, shortcut]
        spark_job:
          name: "sales-shortcut-job"
          entrypoint: "python -m datacore.cli.main run --layer bronze --config examples/fabric/bronze_shortcut.yaml"
        shortcut:
          target: "https://onelake.dfs.fabric.microsoft.com/workspace/lakehouse.Lakehouse/Files/sales/"
          path: "Files/sales_shortcut"

