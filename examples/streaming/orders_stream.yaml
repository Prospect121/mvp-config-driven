project: retail360
environment: dev
platform: azure
datasets:
  - name: orders_stream
    layer: bronze
    source:
      type: kafka
      options:
        bootstrapServers: "${KAFKA_BOOTSTRAP}"
        subscribe: "orders"
        startingOffsets: "latest"
      payload_format: json
    transform:
      ops:
        - cast:
            created_at: timestamp
            amount: double
    streaming:
      enabled: true
      trigger: "1 minute"
      checkpoint_location: "abfss://chk@storage.dfs.core.windows.net/orders_stream/_chk/"
    incremental:
      mode: append
      watermark:
        column: created_at
        delay_threshold: "10 minutes"
    sink:
      type: nosql
      engine: cosmosdb
      options:
        spark.cosmos.accountEndpoint: "${SECRET:COSMOS_ENDPOINT}"
        spark.cosmos.accountKey: "${SECRET:COSMOS_KEY}"
        spark.cosmos.database: retail
        spark.cosmos.container: orders
      checkpoint_location: "abfss://chk@storage.dfs.core.windows.net/orders_stream/_chk/"

