[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datacore"
version = "1.0.0"
description = "Multicloud config-driven ETL/ELT framework"
authors = [{name = "Prospect121"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyspark>=3.4.0",
  "pyyaml>=6.0",
  "jsonschema>=4.20",
  "requests>=2.31",
  "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "black>=24.3",
]
fabric = [
  "azure-identity>=1.17",
  "azure-keyvault-secrets>=4.7",
  "requests>=2.31",
  "delta-spark>=3.0; python_version >= '3.9'",
  "azure-kusto-data>=4.5; python_version >= '3.9'",
  "azure-kusto-ingest>=4.5; python_version >= '3.9'",
  "pyodbc>=5.0; platform_system=='Windows' or platform_system=='Linux'",
  "azure-storage-blob>=12.19",
]
gcp = [
  "google-cloud-storage>=2.14",
]

[project.scripts]
prodi = "datacore.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["datacore*"]

[tool.setuptools.package-data]
"datacore.config.schemas" = ["*.json"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [
  "tests",
]
addopts = "-ra --strict-markers"
markers = [
  "integration: pruebas que requieren Spark + MinIO",
]
